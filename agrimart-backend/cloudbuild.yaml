# Build and deploy AgriMart API to Cloud Run
# Trigger: gcloud builds submit --config cloudbuild.yaml
#
# Required substitutions (set in Cloud Build trigger or pass via --substitutions):
#   _REGION=asia-south1
#   _SERVICE=agrimart-api

substitutions:
  _REGION: asia-south1
  _SERVICE: agrimart-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/agrimart/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/agrimart/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/agrimart/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/agrimart/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --concurrency=80

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/agrimart/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/agrimart/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
